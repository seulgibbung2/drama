<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="드라마중국어">
<title>드라마 중국어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
/* 위: 고정 플레이어 / 아래: 대사 목록 / 맨 아래: 조작 버튼 */
:root{
  --bg:#f6f5f2; --card:#ffffff; --fg:#1d1c1a; --muted:#77736b; --line:#e4e1da;
  --accent:#c8302a; --accent-soft:#fbe9e7; --hl:#fff4d6;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --card:#1e1d1b; --fg:#efece6; --muted:#9c978e; --line:#2f2d2a;
  --accent:#ff6b5e; --accent-soft:#3a1f1c; --hl:#3a321c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ko);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;background:var(--bg)}
header select{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.tabbtn{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:none}
.player>div,.player iframe{position:absolute;inset:0;width:100%;height:100%}
#list{flex:1;overflow-y:auto;padding:8px 12px 12px;-webkit-overflow-scrolling:touch}
.line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.line.on{border-color:var(--accent);background:var(--hl)}
.t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.zh{font-family:var(--zh);font-size:23px;line-height:2.25;margin:0;letter-spacing:0}
/* 칸 너비 = 한자 너비. 병음은 칸 밖으로 넘쳐도 한자 가운데 위에 */
.zh .c{position:relative;display:inline-block;margin:0 .5px}
.zh .c i{position:absolute;left:50%;bottom:78%;width:0;display:flex;justify-content:center;white-space:nowrap;
  font-style:normal;font-family:var(--ko);font-size:8.8px;line-height:1;letter-spacing:-0.35px;color:var(--muted)}
.w{border-radius:4px}
.w:active,.w.sel{background:var(--accent-soft)}
.ko{font-size:16px;line-height:1.5}
.t .no{font-weight:700;color:var(--fg);margin-right:6px}
.en{font-size:13px;color:var(--muted);margin-top:2px}
body.nopy .zh .c i{visibility:hidden}
#pop .pm{font-size:15px;line-height:1.5}
#pop .pm div{margin-bottom:4px}
#pop .pm b{font-weight:600;font-size:12px;color:var(--muted);margin-right:4px}
body.noen .en{display:none}
.os{font-size:13px;color:var(--muted);margin-top:2px}
.os b{font-weight:600;margin-right:4px}
body.noos .os{display:none}
body.hidezh .zh{filter:blur(7px)}
body.hidezh .line.peek .zh{filter:none}
body.hideko .ko,body.hideko .os{filter:blur(6px)}
body.hideko .line.peek .ko,body.hideko .line.peek .os{filter:none}
.bar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--card);border-top:1px solid var(--line)}
.bar button{font:inherit;font-size:13px;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);line-height:1.15}
.bar button b{display:block;font-size:19px}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 6px}
.opts button{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.opts button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#pop{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20}
#pop .pw{font-family:var(--zh);font-size:30px}
#pop .pp{color:var(--accent);font-size:16px;margin-left:8px}
#pop .pm{font-size:17px;margin:6px 0 10px;min-height:1.4em}
#pop .row{display:flex;gap:8px}
#pop button,#pop a{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none}
#pop .save.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#words{flex:1;overflow-y:auto;padding:8px 12px}
.wd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wd .a{font-family:var(--zh);font-size:22px}
.wd .b{color:var(--accent);font-size:14px}
.wd .c{font-size:14px}
.wd button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.7}
.t{display:flex;align-items:center;gap:6px}
.askb{margin-left:auto;font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.line.on .askb{border-color:var(--accent);color:var(--accent)}
#ask{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#ask .sheet{width:100%;max-width:760px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90%;overflow-y:auto}
#ask .q-zh{font-family:var(--zh);font-size:22px;line-height:1.5}
#ask .q-ko{color:var(--muted);font-size:14px;margin:2px 0 12px}
#ask .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#ask .chips button{font:inherit;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#ask textarea{width:100%;min-height:84px;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
#ask .go{display:block;text-align:center;margin-top:10px;padding:13px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-size:16px;font-weight:600}
#ask .sub{display:flex;gap:8px;margin-top:8px}
#ask .sub button{flex:1;font:inherit;font-size:14px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 60px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:30}
</style>
</head>
<body>
<div class="app">
  <header>
    <select id="ep" aria-label="에피소드"></select>
    <button class="tabbtn" id="tabWords">★ 단어장</button>
    <span id="ver" style="font-size:10px;color:var(--muted)">v7</span>
  </header>
  <div class="player"><div id="yt"></div></div>
  <div id="main" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="opts" style="padding-top:8px">
      <button id="oPy" class="on">병음</button>
      <button id="oOs">원래 자막</button>
      <button id="oEn">영어</button>
      <button id="oHideZh">중국어 가리기</button>
      <button id="oHideKo">한국어 가리기</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="wordsView" style="display:none;flex-direction:column;flex:1;min-height:0">
    <div id="words"></div>
  </div>
  <div class="bar">
    <button id="bPrev"><b>⏮</b>이전</button>
    <button id="bLoop"><b>🔁</b>반복</button>
    <button id="bPlay"><b>▶</b>재생</button>
    <button id="bNext"><b>⏭</b>다음</button>
    <button id="bStop" class="on"><b>⏸</b>문장멈춤</button>
  </div>
</div>
<div id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let EPS = [], EP = null, LINES = [], cur = -1, player = null, ready = false;
let loop = false, autoStop = store.get('autoStop', true), stopAt = null, speed = 1;
let words = store.get('words', []);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,1400) }
function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

/* ---------- 옵션 토글 ---------- */
function opt(id, cls, key, invert){
  const b=$(id); let on=store.get(key, b.classList.contains('on'));
  const apply=()=>{ b.classList.toggle('on',on); document.body.classList.toggle(cls, invert?!on:on) };
  b.onclick=()=>{ on=!on; store.set(key,on); apply() }; apply();
}
opt('#oPy','nopy','py',true); opt('#oOs','noos','os',true); opt('#oEn','noen','en',true);
opt('#oHideZh','hidezh','hzh',false); opt('#oHideKo','hideko','hko',false);

/* ---------- 에피소드 ---------- */
async function loadEpisodes(){
  EPS = await fetch('episodes.json?'+Date.now()).then(r=>r.json());
  const sel=$('#ep');
  sel.innerHTML = EPS.map((e,i)=>`<option value="${i}">${esc(e.title)}</option>`).join('');
  const last = store.get('lastEp', EPS[0]?.id);
  const idx = Math.max(0, EPS.findIndex(e=>e.id===last));
  sel.value = idx; sel.onchange = ()=>openEp(+sel.value);
  await openEp(idx);
}
async function openEp(i){
  EP = EPS[i]; store.set('lastEp', EP.id);
  LINES = await fetch('ep/'+EP.id+'.json').then(r=>r.json());
  DICT = await fetch('ep/'+EP.id+'.dict.json?v='+VERSION).then(r=>r.ok?r.json():{}).catch(()=>({}));
  cur=-1; render();
  if (ready) player.cueVideoById({videoId:EP.id, startSeconds: store.get('pos_'+EP.id, 0)});
}
/* 한자 한 글자마다 병음 하나 (份儿 fènr 처럼 개수가 안 맞으면 첫 글자 위에 통째로) */
function chars(w,p){
  const cs=[...w], ps=p.split(' ');
  return cs.map((c,k)=>{
    const py = ps.length===cs.length ? ps[k] : (k===0 ? p : '');
    return `<span class="c">${esc(c)}${py?`<i>${esc(py)}</i>`:''}</span>`;
  }).join('');
}
function render(){
  $('#list').innerHTML = LINES.map((l,i)=>{
    const zh = l.w.map(([w,p],j)=> p ? `<span class="w" data-i="${i}" data-j="${j}">${chars(w,p)}</span>` : `<span>${esc(w)}</span>`).join('');
    return `<div class="line" id="L${i}" data-i="${i}"><div class="t"><b class="no">${i+1}</b>${fmt(l.s)}${l.g?' · <span style="color:var(--accent)">추정</span>':''}<button class="askb" data-ask="${i}">🤖 Claude에게 묻기</button></div><div class="zh">${zh}</div><div class="ko">${esc(l.kt||l.ko)}</div>${l.kt&&l.ko?`<div class="os"><b>자막</b>${esc(l.ko)}</div>`:''}${l.en?`<div class="en">${esc(l.en)}</div>`:''}</div>`;
  }).join('');
}

/* ---------- 대사 / 단어 누르기 ---------- */
$('#list').addEventListener('click', e=>{
  const ab = e.target.closest('.askb');
  if (ab){ e.stopPropagation(); openAsk(+ab.dataset.ask, ''); return }
  const w = e.target.closest('.w');
  if (w){ e.stopPropagation(); showWord(+w.dataset.i, +w.dataset.j, w); return }
  const ln = e.target.closest('.line'); if(!ln) return;
  const i=+ln.dataset.i;
  if (document.body.matches('.hidezh,.hideko') && !ln.classList.contains('peek') && i===cur){ ln.classList.add('peek'); return }
  playLine(i);
});
function playLine(i){
  if(!ready || i<0 || i>=LINES.length) return;
  closePop();
  cur=i; mark(i);
  const l=LINES[i];
  stopAt = (autoStop||loop) ? l.e + 0.15 : null;
  player.seekTo(Math.max(0,l.s-0.15), true); player.playVideo();
}
function mark(i){
  document.querySelectorAll('.line.on').forEach(x=>x.classList.remove('on','peek'));
  const el=$('#L'+i); if(!el) return;
  el.classList.add('on');
  const box=$('#list'), top=el.offsetTop-box.offsetTop;
  if (top < box.scrollTop+10 || top+el.offsetHeight > box.scrollTop+box.clientHeight-10)
    box.scrollTo({top: top - box.clientHeight*0.3, behavior:'smooth'});
}

/* ---------- 단어 팝업 (뜻: 화마다 미리 만든 사전 ep/<id>.dict.json, 없으면 네이버 사전) ---------- */
let DICT = {};
const naverUrl = w => 'https://zh.dict.naver.com/#/search?query='+encodeURIComponent(w);
function showWord(i,j,el){
  document.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
  const [w,p]=LINES[i].w[j];
  const d=DICT[w];
  const m = d ? d.m.map(x=>(x.pos?x.pos+' ':'')+x.m).join(' / ') : '';
  const saved = words.some(x=>x.w===w);
  const pop=$('#pop'); pop.hidden=false;
  const body = d
    ? d.m.map(x=>`<div>${x.pos?`<b>${esc(x.pos)}</b>`:''}${esc(x.m)}</div>`).join('') + (d.split?'<div class="t">사전에 없는 묶음이라 글자별 뜻이에요</div>':'')
    : `<div>이 단어는 사전 파일에 없어요.</div><a href="${naverUrl(w)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px">네이버 중국어사전에서 보기 →</a>`;
  pop.innerHTML=`<div><span class="pw">${esc(w)}</span><span class="pp">${esc(p)}</span></div>
    <div class="pm">${body}</div>
    <div class="row"><button class="save ${saved?'on':''}">${saved?'★ 저장됨':'☆ 단어장'}</button>
    <button class="askw">🤖 Claude</button>
    <button class="close" style="margin-left:auto">닫기</button></div>`;
  pop.querySelector('.close').onclick=closePop;
  pop.querySelector('.askw').onclick=()=>{ closePop(); openAsk(i, `'${w}'는 여기서 무슨 뜻이고, 왜 이 자리에 쓰였어?`) };
  pop.querySelector('.save').onclick=e=>{
    const k=words.findIndex(x=>x.w===w);
    if(k>=0){ words.splice(k,1); e.target.textContent='☆ 단어장'; e.target.classList.remove('on') }
    else { words.unshift({w,p,m,ko:LINES[i].kt||LINES[i].ko,zh:LINES[i].w.map(x=>x[0]).join(''),ep:EP.id,s:LINES[i].s}); e.target.textContent='★ 저장됨'; e.target.classList.add('on'); toast('단어장에 저장했어요') }
    store.set('words',words);
  };
}
function closePop(){ $('#pop').hidden=true; document.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel')) }

/* ---------- Claude에게 묻기 (claude.ai 새 대화로 질문을 넘김) ---------- */
const zhOf = l => l.w.map(x=>x[0]).join('');
const pyOf = l => l.w.filter(x=>x[1]).map(x=>x[1]).join(' ');
let askI = 0;
function askPrompt(q){
  const l=LINES[askI], prev=LINES[askI-1], next=LINES[askI+1];
  return `중국 드라마 《${EP.title}》 대사를 공부하고 있어. 나는 한국인이고 HSK 4급 정도야.

문장: ${zhOf(l)}
병음: ${pyOf(l)}
한국어 번역: ${l.kt||l.ko}${l.kt&&l.ko?`
(드라마 자막: ${l.ko})`:''}
${prev?`앞 대사: ${zhOf(prev)} (${prev.kt||prev.ko})\n`:''}${next?`뒤 대사: ${zhOf(next)} (${next.kt||next.ko})\n`:''}
질문: ${q || '이 문장을 자세히 설명해줘.'}

짧고 쉽게 한국어로 설명해줘. 어려운 문법 용어는 쓰지 말고, 다른 쓰임과 비교하지 마.
1) 문장 뜻 한 줄
2) 중요한 단어 뜻 (병음 포함)
3) 이 문장에서 알아둘 점 한 가지
4) 비슷한 예문 1개 (병음, 뜻 포함)`;
}
function openAsk(i, q){
  askI=i; const l=LINES[i];
  let box=$('#ask');
  if(!box){ box=document.createElement('div'); box.id='ask'; document.body.appendChild(box);
    box.addEventListener('click',e=>{ if(e.target===box) box.hidden=true }) }
  box.hidden=false;
  const chips=['이 문장 쉽게 설명해줘','이 단어 왜 여기 썼어?','비슷한 예문 하나 더','실제로 자주 쓰는 말이야?'];
  box.innerHTML=`<div class="sheet">
    <div class="q-zh">${esc(zhOf(l))}</div><div class="q-ko">${esc(l.kt||l.ko)}</div>
    <div class="chips">${chips.map(c=>`<button>${c}</button>`).join('')}</div>
    <textarea id="askq" placeholder="궁금한 걸 적어 주세요. 예) 绑은 무슨 뜻이야? 过去는 '가본 적 있다' 아니야?">${esc(q)}</textarea>
    <a class="go" target="_blank" rel="noopener">Claude에게 물어보기 →</a>
    <div class="sub"><button class="copy">질문 복사</button><button class="cls">닫기</button></div>
  </div>`;
  const ta=box.querySelector('#askq'), go=box.querySelector('.go');
  const upd=()=>{ go.href='https://claude.ai/new?q='+encodeURIComponent(askPrompt(ta.value.trim())) };
  ta.oninput=upd; upd();
  box.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ ta.value=b.textContent; upd() });
  box.querySelector('.cls').onclick=()=>box.hidden=true;
  box.querySelector('.copy').onclick=()=>{ navigator.clipboard.writeText(askPrompt(ta.value.trim())).then(()=>toast('복사했어요. Claude 앱에 붙여넣으세요'),()=>{ ta.select(); toast('복사가 안 돼요. 직접 복사해 주세요') }) };
  go.onclick=()=>{ ta.blur(); box.hidden=true };
}
/* Claude 앱에 갔다가 돌아오면: 묻기 창 닫고 화면 위치 바로잡기 (아이폰 홈화면 앱 터치 어긋남 방지) */
function backFromAway(){
  if(document.hidden) return;
  const b=$('#ask'); if(b) b.hidden=true;
  if(document.activeElement) document.activeElement.blur();
  window.scrollTo(0,0);
}
document.addEventListener('visibilitychange', backFromAway);
window.addEventListener('pageshow', backFromAway);
window.addEventListener('focus', backFromAway);

/* ---------- 단어장 ---------- */
$('#tabWords').onclick=()=>{
  const show = $('#wordsView').style.display==='none';
  $('#wordsView').style.display = show?'flex':'none';
  $('#main').style.display = show?'none':'flex';
  $('#tabWords').textContent = show ? '← 대사' : '★ 단어장';
  if(show) renderWords(); closePop();
};
function renderWords(){
  const box=$('#words');
  if(!words.length){ box.innerHTML='<div class="empty">아직 저장한 단어가 없어요.<br>대사에서 단어를 누르고 ☆ 단어장을 눌러 보세요.</div>'; return }
  box.innerHTML = `<div class="t" style="margin:2px 0 8px">${words.length}개 · 누르면 그 장면으로 가요</div>` + words.map((x,k)=>`<div class="wd" data-k="${k}"><div style="min-width:0"><span class="a">${esc(x.w)}</span> <span class="b">${esc(x.p)}</span><div class="c">${esc(x.m||'')}</div><div class="t">${esc(x.zh)}</div></div><button data-del="${k}">삭제</button></div>`).join('');
}
$('#words').addEventListener('click', async e=>{
  if(e.target.dataset.del!=null){ words.splice(+e.target.dataset.del,1); store.set('words',words); renderWords(); return }
  const d=e.target.closest('.wd'); if(!d) return;
  const x=words[+d.dataset.k];
  const ei=EPS.findIndex(q=>q.id===x.ep); if(ei<0) return;
  $('#tabWords').click();
  if(EP.id!==x.ep){ $('#ep').value=ei; await openEp(ei); await new Promise(r=>setTimeout(r,600)) }
  const li=LINES.findIndex(l=>l.s===x.s); if(li>=0) playLine(li);
});

/* ---------- 조작 버튼 ---------- */
$('#bPrev').onclick=()=>playLine(cur<=0?0:cur-1);
$('#bNext').onclick=()=>playLine(cur+1);
$('#bLoop').onclick=()=>{ loop=!loop; $('#bLoop').classList.toggle('on',loop); if(loop && cur>=0) playLine(cur); else if(!loop && !autoStop) stopAt=null; toast(loop?'이 문장을 계속 반복해요':'반복 끔') };
$('#bStop').onclick=()=>{ autoStop=!autoStop; store.set('autoStop',autoStop); $('#bStop').classList.toggle('on',autoStop); if(!autoStop && !loop) stopAt=null; toast(autoStop?'한 문장마다 멈춰요':'계속 이어서 재생해요') };
$('#bStop').classList.toggle('on',autoStop);
$('#bPlay').onclick=()=>{
  if(!ready) return;
  if(player.getPlayerState()===1){ player.pauseVideo(); return }
  if(cur>=0 && stopAt!==null && player.getCurrentTime()>=stopAt-0.3) playLine(cur+1>=LINES.length?cur:cur+1);
  else { stopAt=null; player.playVideo() }
};

/* ---------- 유튜브 ---------- */
function onYouTubeIframeAPIReady(){
  const go=()=>{ if(!EP) return setTimeout(go,100);
    player=new YT.Player('yt',{videoId:EP.id,
      playerVars:{playsinline:1,rel:0,modestbranding:1,cc_load_policy:0,iv_load_policy:3,start:Math.floor(store.get('pos_'+EP.id,0))},
      events:{onReady:()=>{ready=true}, onStateChange:e=>{
        if(e.data===1){ try{ player.unloadModule('captions'); player.unloadModule('cc') }catch(_){} } /* 유튜브 자막 겹침 끄기 */
        $('#bPlay').innerHTML = e.data===1 ? '<b>⏸</b>멈춤' : '<b>▶</b>재생';
      }}});
  }; go();
}
let tick=0;
setInterval(()=>{
  if(!ready || !LINES.length || player.getPlayerState()!==1) return;
  const t=player.getCurrentTime();
  if(++tick%10===0) store.set('pos_'+EP.id, t);
  if(stopAt!==null && t>=stopAt){
    if(loop){ player.seekTo(Math.max(0,LINES[cur].s-0.15),true); return }
    player.pauseVideo(); stopAt=null; return;
  }
  let i=-1; for(let k=0;k<LINES.length;k++){ if(LINES[k].s-0.2<=t){ i=k } else break }
  if(i>=0 && t<=LINES[i].e+1.5 && i!==cur){
    cur=i; mark(i);
    if(autoStop && stopAt===null) stopAt=LINES[i].e+0.15;
  }
},120);

/* 새 버전 자동 확인: version.txt가 바뀌면 캐시 피해서 다시 열기 */
const VERSION='11';
async function checkUpdate(){
  try{
    const v=(await fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(r=>r.text())).trim();
    if(v && v!==VERSION) location.replace(location.pathname+'?v='+v);
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate() });
loadEpisodes();
const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
